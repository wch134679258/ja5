# ============================================================
#  dev 环境（默认激活）：本地开发 / 演示
# ============================================================

server.port=8081

# ============ 数据源（本地 MySQL，库名 springboot_test） ============
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ MyBatis-Plus ============
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

# SQL 日志改为走日志框架（slf4j），受 logging.level 控制：
# 原来用 StdOutImpl 直接写 System.out，会绕过日志级别、也没法归档，
# 请求一多就把控制台刷爆，间接拖慢接口。
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-prefix=

# dev 默认打开 mapper 的 SQL 日志（比原来的 StdOutImpl 安静：能归档、能按级别关）。
# 觉得吵就删掉这一行，或把 debug 改成 info。
logging.level.com.fenglin.springboottest.mapper=debug

# JWT（演示密钥，生产通过环境变量 APP_JWT_SECRET 覆盖）
app.jwt.secret=springboot-test-secret-key-please-change-me-1234567890abcdef
app.jwt.expire-ms=86400000

# 改代码自动重启（spring-boot:run 下生效）
spring.devtools.restart.enabled=true
