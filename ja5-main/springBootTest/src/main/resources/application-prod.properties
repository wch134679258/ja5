# ============================================================
#  prod 环境：部署时用 -Dspring.profiles.active=prod 激活
#  所有敏感项（数据库密码 / JWT 密钥）都走环境变量，不要直接写死在这里
# ============================================================

server.port=${SERVER_PORT:8081}

# ============ 数据源 ============
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/springboot_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池（默认值偏小，生产按并发适当调大）
spring.datasource.hikari.pool-name=HikariPool-springBootTest
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============ MyBatis-Plus ============
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 生产环境不打印 SQL（要排查时临时把 com.fenglin.springboottest.mapper 调到 debug）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-prefix=

# ============ JWT ============
# 生产必须通过环境变量注入强随机密钥（>= 48 字节，建议 64 字节随机串）
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expire-ms=${APP_JWT_EXPIRE_MS:86400000}

# ============ 日志 ============
logging.level.root=warn
logging.level.com.fenglin.springboottest=info
