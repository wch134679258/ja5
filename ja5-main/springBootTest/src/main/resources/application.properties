# ============================================================
#  springBootTest · 全局公共配置（与 profile 无关）
#  环境切换：默认 dev；生产用 -Dspring.profiles.active=prod
#           或环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
# ============================================================

spring.application.name=springBootTest
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- 日志 ----------
# 根级别 info；业务包 info；SQL 日志由各 profile 单独控制
# （application-dev.properties 打开 mapper debug，prod 关闭）
logging.level.root=info
logging.level.com.fenglin.springboottest=info

# 日志文件：默认写在运行目录 log/ 下，可用 LOG_PATH 环境变量覆盖
# 轮转 / 归档策略见 src/main/resources/logback-spring.xml
logging.file.name=${LOG_PATH:log/springboot-test.log}

# 控制台 / 文件日志格式（去掉 %L 行号与 %M 方法名：这两项每行都要做
# 调用栈回溯，是日志输出的主要开销，排查时再按需临时打开）
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15thread] %-40.40logger{39} : %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15thread] %-40.40logger{39} : %m%n

# ---------- 优雅停机 ----------
# 收到停止信号后不再接新请求，等待进行中的请求处理完（默认 20 秒）
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------- 错误响应 ----------
# 不向客户端回传异常堆栈与内部错误细节；对外的统一文案由
# GlobalExceptionHandler 生成，避免把 SQL / 配置信息泄露给前端
server.error.include-stacktrace=never
server.error.include-message=never
