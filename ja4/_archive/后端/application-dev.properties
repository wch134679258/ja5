server.port=8081

# ============ 数据源（本地 MySQL，库名 springboot_test） ============
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ MyBatis-Plus ============
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-prefix=

# JWT（演示密钥，生产请替换为强随机密钥并通过环境变量注入）
app.jwt.secret=springboot-test-secret-key-please-change-me-1234567890abcdef
app.jwt.expire-ms=86400000
